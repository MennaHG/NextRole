[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nextrole"
version = "0.1.0"
description = "A configurable, open-source AI-powered job-search agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NextRole contributors" }]
dependencies = [
    "langchain-core>=0.3,<2",
    "langchain-chroma>=0.2,<2",
    "langchain-text-splitters>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "langchain-anthropic>=0.3,<2",
    "langchain-google-genai>=2.0,<4",
    "langchain-ollama>=0.2,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "perplexityai>=0.14,<1",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
nextrole = "nextrole.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nextrole"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
